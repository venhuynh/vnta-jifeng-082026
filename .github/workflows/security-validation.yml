name: Security validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  secret-and-dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject known development credential patterns
        shell: bash
        run: |
          matches="$(git grep -IlE 'Host=192\.168|Password=postgres|1qaz!QAZ' -- src/Vnta.HRM2026 || true)"
          if [ -n "$matches" ]; then
            echo "Known development credential pattern found in:"
            printf '%s\n' "$matches"
            exit 1
          fi

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Configure the private DevExpress package source
        env:
          DEVEXPRESS_NUGET_SOURCE: ${{ secrets.DEVEXPRESS_NUGET_SOURCE }}
          DEVEXPRESS_NUGET_USERNAME: ${{ secrets.DEVEXPRESS_NUGET_USERNAME }}
          DEVEXPRESS_NUGET_PASSWORD: ${{ secrets.DEVEXPRESS_NUGET_PASSWORD }}
        run: |
          test -n "$DEVEXPRESS_NUGET_SOURCE"
          test -n "$DEVEXPRESS_NUGET_USERNAME"
          test -n "$DEVEXPRESS_NUGET_PASSWORD"
          dotnet nuget add source "$DEVEXPRESS_NUGET_SOURCE" --name "DevExpress 26.1 Local" --username "$DEVEXPRESS_NUGET_USERNAME" --password "$DEVEXPRESS_NUGET_PASSWORD" --store-password-in-clear-text

      - name: Restore and scan vulnerable dependencies
        working-directory: src/Vnta.HRM2026
        run: |
          dotnet restore Vnta.Hrm.slnx
          dotnet list Vnta.Hrm.slnx package --vulnerable --include-transitive

      - name: Run security boundary regression tests
        working-directory: src/Vnta.HRM2026
        run: dotnet test Vnta.Hrm.Web.Tests/Vnta.Hrm.Web.Tests.csproj --no-restore
